name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROVIDER_MODE: mock
  PUBLISH_MODE: mock
  NPM_VERSION: 11.21.3 # package.json packageManager 과 동일 (docs/decisions.md DR-006)

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build

  db-integration:
    name: Supabase · integration · real render · E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOB_DISPATCH_MODE: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Start local Supabase (migrations applied on start)
        run: npm run db:start
      - name: DB lint (plpgsql_check)
        run: npx supabase db lint --fail-on warning
      - name: DB advisors (security/performance)
        run: npx supabase db advisors --fail-on warn
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript > /tmp/database.types.ts
          diff -u src/server/database.types.ts /tmp/database.types.ts
      - name: Remotion bundle (실제 렌더 테스트·빌드용)
        run: npm run remotion:bundle
      - name: Integration tests (실제 Remotion 렌더 포함)
        run: npm run test:integration
      - name: App env from local Supabase (NEXT_PUBLIC_* 는 빌드 시 고정)
        run: node scripts/local-env.mjs >> "$GITHUB_ENV"
      - name: Build app
        run: npx next build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (실제 브라우저 전체 흐름)
        run: npm run test:e2e
        env:
          JOB_DISPATCH_MODE: inline
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true
